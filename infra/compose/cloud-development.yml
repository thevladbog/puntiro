name: puntiro-cloud-development

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/compose/.env.cloud}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/compose/.env.cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env.cloud}
    ports:
      - "127.0.0.1:${PUNTIRO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - puntiro-cloud-postgres:/var/lib/postgresql/data

  cloud:
    profiles: ["cloud-runtime"]
    image: ${PUNTIRO_CLOUD_IMAGE:-puntiro-cloud:local}
    user: "${PUNTIRO_CLOUD_UID:?set PUNTIRO_CLOUD_UID in infra/compose/.env.cloud}:${PUNTIRO_CLOUD_GID:?set PUNTIRO_CLOUD_GID in infra/compose/.env.cloud}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    env_file:
      - path: ${PUNTIRO_CLOUD_RUNTIME_ENV_FILE:?set PUNTIRO_CLOUD_RUNTIME_ENV_FILE in infra/compose/.env.cloud}
        required: true
        format: raw
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Puntiro__Security__DataProtectionKeysPath: /var/lib/puntiro/data-protection-keys
      Puntiro__Security__DataProtectionCertificatePath: /run/puntiro-secrets/data-protection.pfx
    volumes:
      - type: bind
        source: ${Puntiro__Security__DataProtectionKeysPath:?set Puntiro__Security__DataProtectionKeysPath in cloud-runtime.env}
        target: /var/lib/puntiro/data-protection-keys
        bind:
          create_host_path: false
      - type: bind
        source: ${Puntiro__Security__DataProtectionCertificateHostPath:?set Puntiro__Security__DataProtectionCertificateHostPath in infra/compose/.env.cloud}
        target: /run/puntiro-secrets/data-protection.pfx
        read_only: true
        bind:
          create_host_path: false

volumes:
  puntiro-cloud-postgres:
